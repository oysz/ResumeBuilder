name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure 7zip binary for electron-builder
        run: npm install --no-save 7zip-bin@5.2.0

      - name: Build frontend
        run: npm run desktop:build

      - name: Build desktop package (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --projectDir apps/desktop --mac --publish never

      - name: Build desktop package (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --projectDir apps/desktop --win --publish never

      - name: Build desktop package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --projectDir apps/desktop --linux --publish never

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ matrix.os }}
          path: apps/desktop/release/**
          if-no-files-found: error

  publish-release:
    needs: desktop-build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub release
        run: |
          tag_name="${GITHUB_REF_NAME}"
          if ! gh release view "$tag_name" >/dev/null 2>&1; then
            gh release create "$tag_name" --generate-notes
          fi

      - name: Upload desktop release assets
        run: |
          tag_name="${GITHUB_REF_NAME}"
          mapfile -t files < <(find release-assets -type f | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found"
            exit 1
          fi
          gh release upload "$tag_name" "${files[@]}" --clobber

  mobile-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Expo token
        id: expo-token
        run: |
          if [ -n "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build mobile apps with EAS
        if: steps.expo-token.outputs.enabled == 'true'
        run: npm run release --workspace @resume-builder/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
